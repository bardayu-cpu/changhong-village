<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>苏七镇 HD-2D 样机</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=ZCOOL+XiaoWei&display=swap">
<style>
  :root{
    --ink:#15111b; --panel:#1f1928; --panel2:#2a2235; --line:#3b3148;
    --paper:#efe6d8; --muted:#b1a6ba; --gold:#d4af37; --gold1:#f4d97a; --red:#c0392b; --red0:#8c2f27;
    --display:"ZCOOL XiaoWei","Songti SC","STSong",serif;
    --body:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --pixel:"Silkscreen",ui-monospace,Menlo,monospace;
    color-scheme: dark;
  }
  html,body{background:var(--ink);color:var(--paper)}
  body{margin:0;font:14px/1.55 var(--body)}
  *{box-sizing:border-box}
  #app{display:flex;gap:22px;justify-content:center;align-items:flex-start;padding:16px;min-height:100vh}
  #stage{position:relative;height:calc(100vh - 32px);aspect-ratio:9/16;max-width:calc(100vw - 340px);flex:none;border-radius:16px;overflow:hidden;background:#0c0a10;box-shadow:0 0 0 1px var(--line),0 24px 70px rgba(0,0,0,.55)}
  #c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  .hud{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 9px;border-radius:999px;background:rgba(21,17,27,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:inset 0 0 0 1px rgba(212,175,55,.35);font-size:12.5px;white-space:nowrap}
  .chip i{width:7px;height:7px;border-radius:2px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  #clock b{font:400 11px var(--pixel);letter-spacing:.04em;color:var(--gold1)}
  #dialog{position:absolute;left:12px;right:12px;bottom:16px;padding:18px 16px 14px;background:rgba(22,17,30,.92);border:2px solid var(--gold);border-radius:5px;box-shadow:0 0 0 2px #120e18,0 10px 30px rgba(0,0,0,.45);pointer-events:none}
  #dialog b{position:absolute;top:-13px;left:12px;padding:2px 10px;background:var(--red);border:2px solid var(--gold);border-radius:3px;font:400 14px var(--display);color:var(--gold1);letter-spacing:.08em}
  #dialog b:empty{display:none}
  #dialog p{margin:0;font-size:15.5px;line-height:1.6;letter-spacing:.02em;text-wrap:balance}
  #toast{position:absolute;left:50%;top:54px;transform:translateX(-50%);padding:6px 14px;border-radius:4px;background:rgba(212,175,55,.94);color:#1b1422;font-weight:600;font-size:13px;white-space:nowrap;pointer-events:none}
  #hint{position:absolute;left:0;right:0;bottom:112px;text-align:center;font-size:12px;color:rgba(239,230,216,.8);text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .6s}
  #loading{position:absolute;inset:0;display:grid;place-items:center;background:#0c0a10;font:400 20px var(--display);letter-spacing:.2em;color:var(--gold1)}
  #panel-toggle{display:none}
  #panel{width:300px;flex:none;max-height:calc(100vh - 32px);overflow:auto;padding:22px 20px 18px;background:var(--panel);border-radius:14px;box-shadow:inset 0 0 0 1px var(--line)}
  #panel h1{margin:0;font:400 34px/1 var(--display);letter-spacing:.12em;color:var(--gold1)}
  #panel .sub{margin:8px 0 18px;color:var(--muted);font-size:12.5px}
  #panel section{padding:14px 0;border-top:1px solid var(--line);display:grid;gap:10px}
  #panel h2{margin:0;font-size:11.5px;font-weight:600;letter-spacing:.18em;color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .row label{flex:1}
  .val{font:400 11px var(--pixel);color:var(--gold1);min-width:48px;text-align:right}
  input[type=range]{width:100%;accent-color:var(--gold)}
  input[type=checkbox]{width:17px;height:17px;accent-color:var(--red)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
  .seg button,.jumps button{font:inherit;font-size:12.5px;color:var(--paper);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 0;cursor:pointer}
  .seg button[aria-pressed=true]{background:var(--red0);border-color:var(--gold);color:var(--gold1)}
  .jumps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .seg button:hover,.jumps button:hover{border-color:var(--gold)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold1);outline-offset:2px}
  #fps{font:400 11px var(--pixel);color:var(--gold1)}
  .note{margin:0;color:var(--muted);font-size:12px;line-height:1.6}
  [hidden]{display:none!important}
  @media (max-width:760px){
    #app{padding:0;display:block}
    #stage{height:100vh;height:100dvh;width:100vw;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none}
    #panel-toggle{display:block;position:absolute;right:12px;top:48px;font:inherit;font-size:12px;color:var(--gold1);background:rgba(21,17,27,.78);border:1px solid rgba(212,175,55,.5);border-radius:999px;padding:4px 12px}
    #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:62vh;border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s ease;z-index:5}
    #panel.open{transform:none}
  }
  @media (prefers-reduced-motion:reduce){#panel{transition:none}}
</style>

<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="苏七镇场景，点地面走路"></canvas>
    <div class="hud">
      <span class="chip" id="place"><i></i><span id="place-name">罗曼山庄</span></span>
      <span class="chip" id="clock"><span id="clock-tag">赶场日</span><b id="clock-time">--:--</b></span>
    </div>
    <button id="panel-toggle" type="button" aria-controls="panel" aria-expanded="false">调整</button>
    <div id="toast" hidden></div>
    <div id="dialog" hidden><b id="who"></b><p id="line"></p></div>
    <div id="hint">点地面走路 · 点小动物、球、捐箱试试</div>
    <div id="loading">苏七镇 搭建中</div>
  </div>

  <aside id="panel" aria-label="样机调整">
    <h1>苏七镇</h1>
    <p class="sub" data-dev>HD-2D 场景样机 · 第一版 · 占位美术</p>

    <section>
      <h2>时间</h2>
      <div class="row"><label for="follow">跟随北京时间</label><input type="checkbox" id="follow" checked></div>
      <div class="row"><input type="range" id="hour" min="0" max="24" step="0.25" value="12" aria-label="几点"><span class="val" id="hour-val">12:00</span></div>
      <div class="seg" id="presets">
        <button type="button" data-h="6.5">清晨</button><button type="button" data-h="12">正午</button><button type="button" data-h="18.2">黄昏</button><button type="button" data-h="19.8">夜游</button><button type="button" data-h="23">深夜</button>
      </div>
    </section>

    <section>
      <h2>镇子状态</h2>
      <div class="row"><label for="market">赶场日（逢单日）</label><input type="checkbox" id="market"></div>
      <div class="row"><label for="flood">涨水（6～8 月桥面过水）</label><input type="checkbox" id="flood"></div>
      <div class="row"><label for="lamps">桥灯</label><span class="val" id="lamps-val">5／17</span></div>
      <input type="range" id="lamps" min="0" max="17" step="1" value="5" aria-label="桥灯亮了几盏">
    </section>

    <section data-dev>
      <h2>画质与镜头</h2>
      <div class="seg" id="quality"><button type="button" data-q="low">低</button><button type="button" data-q="mid">中</button><button type="button" data-q="high">高</button></div>
      <div class="row"><label for="zoom">镜头远近</label><span class="val" id="zoom-val">30</span></div>
      <input type="range" id="zoom" min="20" max="52" step="1" value="30" aria-label="镜头远近">
      <div class="row"><span>帧率 · Draw Call</span><span id="fps">--</span></div>
    </section>

    <section>
      <h2>快速去</h2>
      <div class="jumps" id="jumps">
        <button type="button" data-go="roman">罗曼山庄</button><button type="button" data-go="market">本地集市</button><button type="button" data-go="tree">黄葛树</button>
        <button type="button" data-go="street">老街</button><button type="button" data-go="bridge">石板桥</button><button type="button" data-go="home">你家</button>
        <button type="button" data-go="tourist">游客集市</button><button type="button" data-go="temple">月老庙</button><button type="button" data-go="couple">新人家</button>
      </div>
    </section>

    <section data-dev>
      <p class="note">宾客、动物、作物都是临时画的占位像素。阿鱼和 Toretto 没放进样机，美术包规定只能用现有原图。对白全部摘自设计文档。</p>
    </section>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { HorizontalTiltShiftShader } from 'three/addons/shaders/HorizontalTiltShiftShader.js';
import { VerticalTiltShiftShader } from 'three/addons/shaders/VerticalTiltShiftShader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
// 苏七镇 HD-2D 样机
// 坐标：镇子沿峨眉河排布。t 轴顺流（东偏南 18°），s 轴指向北岸。
// 所有静物在“河框架”里建：x = t，z = -s，再整体绕 Y 转 -18° 放进世界。
// 相机永远朝正北看，所以精灵只要朝 +z 就对着镜头。
// =====================================================================

const TH = 18 * Math.PI / 180;
const DX = Math.cos(TH), DZ = Math.sin(TH);      // t 轴在世界里的方向
const NX = Math.sin(TH), NZ = -Math.cos(TH);     // s 轴在世界里的方向
const toWorld = (t, s) => ({ x: t * DX + s * NX, z: t * DZ + s * NZ });
const toFrame = (x, z) => ({ t: x * DX + z * DZ, s: x * NX + z * NZ });

// 地图范围（河框架）
const T0 = -80, T1 = 64, S0 = -64, S1 = 124;
const RIVER = 15;            // 河宽一半
const DECK = 1.1;            // 桥面宽一半
const SPANS = 17;            // 17 孔
const SPAN_L = (RIVER * 2) / SPANS;
const WATER_Y = -0.85, FLOOD_Y = 0.035, BED_Y = -2.2, DECK_TOP = 0.02;

// 调色板：美术生图包 1.2，外加少量土木色
const P = {
  red0:'#8C2F27', red:'#C0392B', red1:'#E8746A', gold0:'#8A6410', gold:'#D4AF37', gold1:'#F4D97A',
  pur0:'#3E3160', pur:'#5B4B8A', pur1:'#9584C4', paper0:'#B8A88E', paper:'#E8DDD0', paper1:'#FFF8EE',
  ink0:'#1E1A2A', ink:'#2C2438', ink1:'#5A4E68', bam0:'#2F5940', bam:'#4A7C59', bam1:'#7BAE84',
  sea0:'#1F3A5C', sea:'#3A6491', sea1:'#6F9BC4', blu0:'#2E4A7A', blu:'#4A6FA5', blu1:'#7E9FCB',
  tile0:'#34323d', tile:'#4a4855', tile1:'#686676', wood0:'#46291d', wood:'#6b432d', wood1:'#916140',
  stone0:'#6d6670', stone:'#8f8893', stone1:'#b1aab4', soil0:'#553826', soil:'#744e35', soil1:'#946845',
  grass0:'#3b6a3d', grass:'#57894a', grass1:'#84ab5c', dirt0:'#93785a', dirt:'#b09470', dirt1:'#cbb08a',
  pink:'#e99ab0', leaf0:'#335e34', leaf:'#548546', leaf1:'#8db35a',
};

// 可复现的随机
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20260615);
const rr = (a, b) => a + (b - a) * rnd();
function hash2(x, y) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => vnoise(x, y) * 0.55 + vnoise(x * 2.3, y * 2.3) * 0.3 + vnoise(x * 5.1, y * 5.1) * 0.15;
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

// 时间规则：与 server-claude/src/time.js 一致（北京时间）
const TZ = 8 * 3600 * 1000;
function bj(now = Date.now()) { const d = new Date(now + TZ); return { mo: d.getUTCMonth() + 1, day: d.getUTCDate(), wd: d.getUTCDay(), h: d.getUTCHours() + d.getUTCMinutes() / 60 }; }
const isMarketDay = (now) => bj(now).day % 2 === 1;            // 逢单日赶场
const isFloodSeason = (now) => { const m = bj(now).mo; return m >= 6 && m <= 8; };
const isNightTour = (h) => h >= 19.5 && h < 20.5;              // 夜游 19:30～20:30

// 全局状态
const S = {
  hour: bj().h, follow: true, market: isMarketDay(), flood: isFloodSeason(), lamps: 5,
  quality: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'mid' : 'high',
  zoom: 30, reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
};

// 对白：全部摘自《苏七镇 · 阶段 1 设计 v1.0》第 4 节和《文案改写版 v2》A8-3
const LINES = {
  arrive: '到啦～ 罗曼山庄 席还没散', leave: '吃好了？走 带你回镇上',
  marketOn: '今天走赶场', marketOff: '双日不赶场 明天来', tourist: '游客买贵些',
  gov: '这是镇政府 里面没啥好玩的', school: '我在这儿念的小学 那棵树那时候就在了',
  leaf: '你在这儿', box: '点灯 一盏 30 棵', lampOne: '亮了一盏', lampAll: '桥全亮了',
  bridge: '桥没栏杆 走中间哈', bridgeFlood: '涨水了 踩着走', southBank: '你家在这边',
  home: '这间是你的 安逸不', luoluoDoor: '落落巴倒你门口睡了一觉', temple: '月老在这儿 想给谁牵线',
  qiuqiuFound: '求求躲在这儿', kicked: '这个球今天踢过了',
  xiduo: '喜多 柯基 看家的', luoluo: '长毛的那只叫落落。落落 天天 合起来是落雨天',
  tiantian: '短毛的那只叫天天。落雨天 loyalty', qiuqiu: '求求 美短 不是求你的意思哈',
};
// =====================================================================
// 像素贴图：全部在 canvas 上逐像素画，放大用最近邻，缩小用 mipmap
// 单张不超过 1024（微信小游戏渲染建议）
// =====================================================================
const RGBC = {};
const rgb = (h) => RGBC[h] || (RGBC[h] = hexRGB(h));

function makeCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g];
}
function texFrom(canvas, { repeat = true, mip = true } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.minFilter = mip ? THREE.LinearMipmapLinearFilter : THREE.NearestFilter;
  t.generateMipmaps = mip; t.anisotropy = 4;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
class Pix {
  constructor(w, h) { [this.c, this.g] = makeCanvas(w, h); this.w = w; this.h = h; this.img = this.g.createImageData(w, h); this.d = this.img.data; }
  set(x, y, hex, a = 255) {
    x |= 0; y |= 0; if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const c = typeof hex === 'string' ? rgb(hex) : hex, i = (y * this.w + x) * 4;
    this.d[i] = c[0]; this.d[i + 1] = c[1]; this.d[i + 2] = c[2]; this.d[i + 3] = a;
  }
  alpha(x, y) { return (x < 0 || y < 0 || x >= this.w || y >= this.h) ? 0 : this.d[(y * this.w + x) * 4 + 3]; }
  rect(x, y, w, h, hex) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, hex); }
  noise(x, y, w, h, cols, seed = 1, scale = 0.35) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const n = fbm((x + i) * scale + seed * 13.1, (y + j) * scale) + (hash2(x + i + seed * 71, y + j) - 0.5) * 0.25;
      this.set(x + i, y + j, cols[Math.max(0, Math.min(cols.length - 1, Math.floor(n * cols.length)))]);
    }
  }
  specks(x, y, w, h, hex, dens, seed = 3) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (hash2(x + i + seed * 977, y + j - seed * 131) < dens) this.set(x + i, y + j, hex); }
  outline(hex) { // 给不透明像素描一圈外框
    const add = [];
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (!this.alpha(x, y) && (this.alpha(x - 1, y) || this.alpha(x + 1, y) || this.alpha(x, y - 1) || this.alpha(x, y + 1))) add.push([x, y]);
    add.forEach(([x, y]) => this.set(x, y, hex));
  }
  done() { this.g.putImageData(this.img, 0, 0); return this.c; }
}

// ---------- 小尺寸重复贴图 ----------
function makeTextures() {
  const T = {};
  let p = new Pix(16, 16); p.noise(0, 0, 16, 16, [P.stone0, P.stone, P.stone, P.stone1], 2, 0.5); p.specks(0, 0, 16, 16, P.paper, 0.05);
  for (let i = 0; i < 16; i++) p.set(i, 15, P.stone0); T.slab = texFrom(p.done());

  p = new Pix(32, 16); p.noise(0, 0, 32, 16, [P.stone0, P.stone, P.stone1], 5, 0.4);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 32; x++) { const off = (Math.floor(y / 5) % 2) * 5; if (y % 5 === 4 || (x + off) % 10 === 9) p.set(x, y, P.ink1); }
  T.wall = texFrom(p.done());

  p = new Pix(24, 24); p.noise(0, 0, 24, 24, [P.paper0, P.paper, P.paper, P.paper1], 7, 0.6);
  for (let y = 0; y < 24; y++) { p.set(0, y, P.wood0); p.set(1, y, P.wood); p.set(12, y, P.wood0); p.set(13, y, P.wood); }
  for (let x = 0; x < 24; x++) { p.set(x, 0, P.wood0); p.set(x, 11, P.wood0); p.set(x, 12, P.wood); }
  T.side = texFrom(p.done());

  p = new Pix(16, 16); p.noise(0, 0, 16, 16, ['#e2dccf', '#ece7dd', '#f4f0e8'], 9, 0.5); T.white = texFrom(p.done());

  p = new Pix(16, 16);
  for (let x = 0; x < 16; x++) { const band = Math.floor(x / 4) % 2; for (let y = 0; y < 16; y++) p.set(x, y, band ? (y % 4 === 3 ? P.wood0 : P.wood) : (y % 4 === 3 ? P.wood0 : P.wood1)); }
  p.specks(0, 0, 16, 16, P.wood0, 0.06); T.wood = texFrom(p.done());

  p = new Pix(16, 16);
  for (let x = 0; x < 16; x++) for (let y = 0; y < 16; y++) { const col = x % 4; const c = col === 0 ? P.tile0 : col === 1 ? P.tile1 : P.tile; p.set(x, y, (y % 4 === 3 && col !== 0) ? P.tile0 : c); }

function goTo(t, s, stopShort = 0) {
  const path = findPath({ t: PLAYER.t, s: PLAYER.s }, { t, s }); if (!path || !path.length) return false;
  if (stopShort) { const L = path[path.length - 1], pv = path.length > 1 ? path[path.length - 2] : PLAYER, d = Math.hypot(L.t - pv.t, L.s - pv.s); if (d > stopShort) path[path.length - 1] = { t: L.t - (L.t - pv.t) / d * stopShort, s: L.s - (L.s - pv.s) / d * stopShort }; else path.pop(); }
  PLAYER.path = path.length ? path : null; return true;
}
function interact(p) {
  const d = Math.hypot(p.ref.t - PLAYER.t, p.ref.s - PLAYER.s);
  PLAYER.pending = p;
  if (d < (p.kind === 'ball' ? 1.7 : 2.6)) { PLAYER.path = null; arrive(); }
  else if (!goTo(p.ref.t, p.ref.s, p.kind === 'ball' ? 1.0 : 1.5)) arrive();
}
function tap(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(ACT.pick.filter(p => p.mesh.visible).map(p => p.mesh), false);
  hideHint();
  if (hits.length) { interact(ACT.pick.find(x => x.mesh === hits[0].object)); return; }
  const pt = new THREE.Vector3(); if (!ray.ray.intersectPlane(GROUND, pt)) return;
  const f = toFrame(pt.x, pt.z); PLAYER.pending = null;
  if (goTo(f.t, f.s)) { TAP.position.set(pt.x, 0.04, pt.z); TAP.userData.life = 1; }
}
function bindInput() {
  const cv = renderer.domElement, ptrs = new Map(); let down = null, pinch0 = 0, zoom0 = 0;
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = S.zoom; down = null; } else down = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointermove', e => { if (!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; setZoom(zoom0 * pinch0 / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y))); } });
  cv.addEventListener('pointerup', e => { ptrs.delete(e.pointerId); if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12) tap(e); down = null; });
  cv.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); down = null; });
  cv.addEventListener('wheel', e => { e.preventDefault(); setZoom(S.zoom * (1 + Math.sign(e.deltaY) * 0.08)); }, { passive: false });
  const K = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd'];
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; if (K.includes(k)) { keys.add(k); hideHint(); e.preventDefault(); } });
  addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
  addEventListener('blur', () => keys.clear());
  addEventListener('resize', resize);
}

// ---------- 面板 ----------
function applyMarket() { REFS.marketOpen.visible = S.market; REFS.marketClosed.visible = !S.market; REFS.npcs.forEach(n => { n.m.visible = n.b.visible = (n.key === 'tourist' || S.market); }); }
function applyLamps(prev) {
  REFS.lamps.forEach((m, i) => m.material = i < S.lamps ? REFS.lampMat.on : REFS.lampMat.off);
  $('lamps-val').textContent = `${S.lamps}／17`;
  if (prev !== undefined) { if (S.lamps === 17 && prev < 17) toast(LINES.lampAll); else if (S.lamps > prev) toast(LINES.lampOne); }
}
function syncHour() { $('hour').value = S.hour; $('hour-val').textContent = fmtH(S.hour); }
function setHour(h, manual = true) { S.hour = h; if (manual) { S.follow = false; $('follow').checked = false; } applyTime(h); syncHour(); }
function bindPanel() {
  $('follow').addEventListener('change', e => { S.follow = e.target.checked; if (S.follow) setHour(bj().h, false); });
  $('hour').addEventListener('input', e => setHour(+e.target.value));
  $('presets').addEventListener('click', e => { const h = e.target.dataset.h; if (h) setHour(+h); });
  $('market').checked = S.market; $('market').addEventListener('change', e => { S.market = e.target.checked; applyMarket(); });
  $('flood').checked = S.flood; $('flood').addEventListener('change', e => { S.flood = e.target.checked; });
  $('lamps').addEventListener('input', e => { const prev = S.lamps; S.lamps = +e.target.value; applyLamps(prev); });
  const qb = [...document.querySelectorAll('#quality button')], mark = () => qb.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.q === S.quality)));
  qb.forEach(b => b.addEventListener('click', () => { S.quality = b.dataset.q; mark(); applyQuality(); })); mark();
  $('zoom').addEventListener('input', e => setZoom(+e.target.value));
  $('jumps').addEventListener('click', e => { const k = e.target.dataset.go; if (!k) return; const p = PLACES[k]; Object.assign(PLAYER, { t: p.t, s: p.s, path: null, pending: null }); const w = toWorld(p.t, p.s); camTarget.set(w.x, 0.9, w.z); closePanel(); });
  const tg = $('panel-toggle'), pn = $('panel');
  function closePanel() { pn.classList.remove('open'); tg.setAttribute('aria-expanded', 'false'); }
  tg.addEventListener('click', () => { const o = pn.classList.toggle('open'); tg.setAttribute('aria-expanded', String(o)); });
}

// ---------- 主循环 ----------
let last = performance.now(), time = 0, clockT = 20, labelT = 0, fpsT = 0, fpsN = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  if (S.follow) { clockT -= dt; if (clockT <= 0) { clockT = 20; setHour(bj().h, false); } }
  updatePlayer(dt, keys); updateWorldActors(dt, time); updateTriggers(); updateDialog(); updateLights(dt); updateCamera(dt);
  const wy = S.flood ? FLOOD_Y : WATER_Y; REFS.water.position.y += (wy - REFS.water.position.y) * Math.min(1, dt * 1.5); REFS.sparkle.position.y = REFS.water.position.y + 0.012;
  const flow = S.flood ? 0.09 : 0.045; TEX.water.offset.x -= dt * flow; TEX.sparkle.offset.x -= dt * flow * 2.2;
  for (const b of REFS.boats) { b.g.position.x += b.speed * dt; if (b.g.position.x > T1 - 4) b.g.position.x = T0 + 4; if (b.g.position.x < T0 + 4) b.g.position.x = T1 - 4; b.g.position.y = REFS.water.position.y + Math.sin(time * 1.5 + b.s) * 0.04; }
  REFS.motes.position.set(camTarget.x, 0, camTarget.z); REFS.motes.material.uniforms.uTime.value = time;
  const cm = REFS.canopy.material, under = Math.hypot(PLAYER.t + 13, PLAYER.s - 39.5) < 7; cm.opacity += ((under ? 0.32 : 1) - cm.opacity) * Math.min(1, dt * 4); cm.depthWrite = cm.opacity > 0.97;
  const kf = Math.min(1, dt * 5);
  for (const g of REFS.fadeGroups) { const tgtO = g.test(PLAYER.t, PLAYER.s) ? 0.2 : 1;
    for (const mt of g.mats) { mt.opacity += (tgtO - mt.opacity) * kf; const tr = mt.opacity < 0.99;
      if (mt.transparent !== tr) { mt.transparent = tr; mt.needsUpdate = true; } mt.depthWrite = !tr; } }
  if (TAP.userData.life > 0) { TAP.userData.life -= dt * 1.6; TAP.scale.setScalar(1 + (1 - TAP.userData.life) * 1.2); TAP.material.opacity = Math.max(0, TAP.userData.life); }
  labelT -= dt; if (labelT <= 0) { labelT = 0.25; $('place-name').textContent = regionName(PLAYER.t, PLAYER.s); $('clock-tag').textContent = (S.market ? '赶场日' : '双日') + (isNightTour(S.hour) ? ' · 夜游' : '') + (S.flood ? ' · 涨水' : ''); $('clock-time').textContent = fmtH(S.hour); }
  renderFrame();
  fpsN++; fpsT += dt; if (fpsT >= 0.5) { $('fps').textContent = `${Math.round(fpsN / fpsT)} / ${renderer.info.render.calls}`; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(loop);
}

async function init() {
  try { await Promise.race([document.fonts.load('22px "ZCOOL XiaoWei"', '苏七镇小学种子铺木匠茶翘儿罗曼山庄月老庙周报'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* 字体没到就用系统宋体 */ }
  TEX = makeTextures(); ATLAS = buildAtlas();
  setupRender($('c')); buildTown(scene); buildGrid(); buildActors(scene);
  TAP = new THREE.Mesh(new THREE.RingGeometry(0.28, 0.38, 24).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: P.gold1, transparent: true, opacity: 0, depthWrite: false })); TAP.userData.life = 0; scene.add(TAP);
  bindInput(); bindPanel(); applyQuality(); applyTime(S.hour); syncHour(); applyMarket(); applyLamps(); setZoom(S.zoom);
  const w = toWorld(PLAYER.t, PLAYER.s); camTarget.set(w.x, 0.9, w.z);
  $('loading').hidden = true; setTimeout(hideHint, 9000);
  say([LINES.arrive, LINES.leave]);
  requestAnimationFrame(loop);
}
init().catch(err => { $('loading').textContent = '没搭起来：' + err.message; console.error(err); });
</script>
